models:
  - name: stg_jaffle_shop__customers
    description: The grain of this table is one unique customer per row.
    columns:
      - name: customer_id
        description: Primary Key for the customers table.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: customer's first name 
      - name: last_name 
        description: customer's last name
          
  - name: stg_jaffle_shop__orders
    description: One order per row.
    columns:
      - name: order_id
        description: Primary key for the orders table.
        data_tests:
          - unique
          - not_null
      - name: order_status
        description: "{{ doc('order_status') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: ['completed', 'shipped', 'placed', 'return_pending', 'returned']
      - name: customer_id
        description: Foreign key for the orders table from the customers table
        data_tests:
          - relationships:
              arguments: 
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
      - name: order_date
        description: The date when order was placed.
      - name: _etl_loaded_at
        description: The datetime when the data was loaded in the table.